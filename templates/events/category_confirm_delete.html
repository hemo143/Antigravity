{% extends 'base.html' %}
{% block title %}Delete Category - EventPro{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-md-5">
        <div class="card card-dashboard border-danger">
            <div class="card-body text-center py-5">
                <i class="bi bi-trash3 text-danger" style="font-size:4rem"></i>
                <h4 class="mt-3">Delete Category?</h4>
                <p class="text-muted">Delete <strong>"{{ category.name }}"</strong>?<br>
                Events in this category will lose their category.</p>
                <div class="d-flex gap-3 justify-content-center mt-4">
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger px-4">Delete</button>
                    </form>
                    <a href="{% url 'events:category_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
