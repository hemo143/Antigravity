{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Password Changed" %} - EventPro{% endblock %}

{% block content %}
<div class="row justify-content-center pt-5">
    <div class="col-md-5">
        <div class="card card-outline card-success shadow">
            <div class="card-header text-center py-4 bg-white border-top border-success border-4">
                <i class="bi bi-shield-check text-success fs-1"></i>
                <h3 class="fw-bold mt-3 mb-0 text-dark">{% trans "Password Reset Complete" %}</h3>
            </div>
            <div class="card-body p-4 text-center">
                <p class="text-muted mb-4">
                    {% trans "Your password has been set. You may now log in with your new password." %}
                </p>
                <div class="mt-4">
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 fw-bold">{% trans "Log In" %}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
