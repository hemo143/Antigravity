services:
  - type: web
    name: apexevents
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: apexevents-db
          property: connectionString

databases:
  - name: apexevents-db
    databaseName: apexevents_db
    user: apexevents_user
    plan: free
