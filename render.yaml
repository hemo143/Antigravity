services:
  - type: web
    name: event-management-system
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: event-management-db
          property: connectionString

databases:
  - name: event-management-db
    databaseName: event_db
    user: event_user
    plan: free
