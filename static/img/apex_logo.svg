<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 284 284" fill="none" role="img" aria-label="Apex Events">
  <!-- Outer diamond -->
  <polygon points="150,20 280,150 150,280 20,150" fill="none" stroke="#9A7A34" stroke-width="3"/>
  <!-- Inner diamond -->
  <polygon points="150,52 248,150 150,248 52,150" fill="none" stroke="#9A7A34" stroke-width="2" opacity="0.55"/>
  <!-- Connector lines -->
  <line x1="150" y1="20"  x2="150" y2="52"  stroke="#9A7A34" stroke-width="2" opacity="0.7"/>
  <line x1="280" y1="150" x2="248" y2="150" stroke="#9A7A34" stroke-width="2" opacity="0.7"/>
  <line x1="150" y1="280" x2="150" y2="248" stroke="#9A7A34" stroke-width="2" opacity="0.7"/>
  <line x1="20"  y1="150" x2="52"  y2="150" stroke="#9A7A34" stroke-width="2" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="150" cy="150" r="6" fill="#9A7A34"/>
</svg>
